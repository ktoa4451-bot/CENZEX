
name: CENZEX ZIP to JAR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          if [ ! -f CENZEX-source-starter.zip ]; then
            echo "ERROR: CENZEX-source-starter.zip not found in repository root"
            exit 1
          fi
          unzip -o CENZEX-source-starter.zip -d extracted
          test -f extracted/cenzex/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build JAR
        working-directory: extracted/cenzex
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CENZEX-JAR
          path: extracted/cenzex/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
